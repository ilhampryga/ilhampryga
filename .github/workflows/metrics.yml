name: 📊 GitHub Metrics

on:
  schedule:
    # Update metrics daily at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    name: Generate Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Metrics — Full Profile
        uses: lowlighter/metrics@latest
        with:
          # Use METRICS_TOKEN if set, otherwise fall back to the built-in GITHUB_TOKEN
          token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || github.token }}
          user: ilhampryga
          template: classic
          base: header, activity, community, repositories, metadata

          # Output — commit directly into the repo
          output_action: commit
          committer_token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || github.token }}
          filename: assets/metrics.svg
          config_timezone: Asia/Jakarta
          config_display: large
          config_animations: yes

          # Languages plugin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Calendar heatmap
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: starred
          plugin_topics_sort: stars

          # Habits & coding schedule
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200

          # Followers / following avatars
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
