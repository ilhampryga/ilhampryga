<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="presentation">
  <defs>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Floating animated particles -->
  <!-- Large ambient orbs -->
  <circle cx="180" cy="100" r="60" fill="#2563EB" opacity="0.04" filter="url(#glow1)">
    <animateTransform attributeName="transform" type="translate" values="0,0;25,-15;0,0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="180" r="80" fill="#3B82F6" opacity="0.03" filter="url(#glow1)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-20,10;0,0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="50" r="40" fill="#60A5FA" opacity="0.04" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,20;0,0" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Small floating dots -->
  <circle cx="90" cy="60" r="3" fill="#3B82F6" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;8,-12;0,0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="220" r="2" fill="#60A5FA" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,8;0,0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="40" r="2.5" fill="#2563EB" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,10;0,0" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="250" r="2" fill="#3B82F6" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0,0;-8,-6;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="30" r="3" fill="#60A5FA" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-8;0,0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="130" r="2.5" fill="#2563EB" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,12;0,0" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="180" r="2" fill="#3B82F6" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,-5;0,0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="200" r="1.5" fill="#60A5FA" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,6;0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="90" r="2" fill="#2563EB" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0,0;7,-4;0,0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Medium particles -->
  <circle cx="140" cy="150" r="1.2" fill="#3B82F6" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;4,8;0,0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="70" r="1.5" fill="#60A5FA" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,4;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="160" r="1" fill="#2563EB" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-6;0,0" dur="11s" repeatCount="indefinite"/>
  </circle>
</svg>
