<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Ilham Adi Prayoga – Hero Banner Dark">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f">
        <animate attributeName="stop-color" values="#0a0a0f;#0d1220;#0a0a0f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0d1220">
        <animate attributeName="stop-color" values="#0d1220;#111827;#0d1220" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#0a0a0f;#111827" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Blue glow gradient -->
    <radialGradient id="glowBlue" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass card gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Shine gradient for card -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Blue accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Blur filter -->
    <filter id="blur12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="16"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="270" cy="110" rx="220" ry="140" fill="url(#glowBlue)" filter="url(#blur12)">
    <animateTransform attributeName="transform" type="translate" values="0,0;20,-10;0,0" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="680" cy="180" rx="180" ry="120" fill="url(#glowBlue2)" filter="url(#blur12)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-15,10;0,0" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating particles -->
  <circle cx="55" cy="42" r="1.5" fill="#3B82F6" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;4,-8;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="55" r="1" fill="#60A5FA" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,5;0,0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="220" r="1.2" fill="#2563EB" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,3;0,0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="240" r="1.8" fill="#3B82F6" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,-6;0,0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="18" r="1" fill="#60A5FA" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="0,0;3,4;0,0" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.8;0.45" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="28" r="1.4" fill="#2563EB" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,7;0,0" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="140" r="1" fill="#60A5FA" opacity="0.25">
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-4;0,0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="160" r="1.3" fill="#3B82F6" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,3;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid dots subtle pattern -->
  <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.6" fill="#3B82F6" opacity="0.08"/>
  </pattern>
  <rect width="900" height="280" fill="url(#dotGrid)" rx="16"/>

  <!-- Glass card -->
  <rect x="32" y="24" width="836" height="232" rx="20" fill="url(#glassGrad)" filter="url(#dropShadow)"/>
  <rect x="32" y="24" width="836" height="232" rx="20" fill="none" stroke="url(#glassBorder)" stroke-width="1"/>
  <!-- Card inner shine -->
  <rect x="33" y="25" width="834" height="80" rx="19" fill="url(#shineGrad)"/>

  <!-- Avatar circle -->
  <circle cx="108" cy="140" r="52" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="52;54;52" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="140" r="44" fill="#1a2035"/>
  <circle cx="108" cy="140" r="44" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Avatar initial — stylized I -->
  <text x="108" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="-1">I</text>

  <!-- Blue accent dot on avatar -->
  <circle cx="142" cy="108" r="7" fill="#111827"/>
  <circle cx="142" cy="108" r="6" fill="#2563EB">
    <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Main text -->
  <!-- Name -->
  <text x="192" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="url(#nameGrad)" letter-spacing="-0.5">
    Ilham Adi Prayoga
  </text>

  <!-- Animated typing role text -->
  <text x="192" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    <tspan fill="#60A5FA" font-weight="500">Software QA</tspan>
    <tspan fill="#64748b"> · </tspan>
    <tspan fill="#94a3b8">Data Analyst</tspan>
    <tspan fill="#64748b"> · </tspan>
    <tspan fill="#94a3b8">IoT Developer</tspan>
    <tspan fill="#64748b"> · </tspan>
    <tspan fill="#94a3b8">Web Developer</tspan>
    <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Divider line -->
  <line x1="192" y1="154" x2="580" y2="154" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Location badge -->
  <rect x="192" y="166" width="106" height="26" rx="13" fill="#1e2a45" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="245" y="183" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#60A5FA" text-anchor="middle" font-weight="500">📍 Indonesia</text>

  <!-- Open to Work badge -->
  <rect x="308" y="166" width="120" height="26" rx="13" fill="#14301a" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="322" cy="179" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="358" y="183" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="500">Open To Work</text>

  <!-- Portfolio link badge -->
  <rect x="440" y="166" width="148" height="26" rx="13" fill="#1a1f35" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="514" y="183" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#60A5FA" text-anchor="middle" font-weight="500">🌐 ilhampryga.pages.dev</text>

  <!-- Stats row -->
  <text x="192" y="226" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#475569" letter-spacing="0.3">
    Indonesia · Informatics Engineering · Building scalable software &amp; IoT solutions
  </text>

  <!-- Right side decorative element -->
  <g transform="translate(700, 80)">
    <!-- Hexagon grid decoration -->
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="none" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.15"/>
    <polygon points="60,20 100,42 100,98 60,120 20,98 20,42" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.1"/>
    <!-- Center icon -->
    <circle cx="60" cy="70" r="22" fill="#111827" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.4"/>
    <text x="60" y="77" font-family="system-ui" font-size="22" text-anchor="middle" fill="#3B82F6" opacity="0.8">⚡</text>
  </g>

  <!-- Bottom-right geometric accent -->
  <circle cx="850" cy="240" r="30" fill="none" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.15"/>
  <circle cx="850" cy="240" r="20" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.1"/>
</svg>
