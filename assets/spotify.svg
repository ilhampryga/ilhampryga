<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 88" width="450" height="88" role="img" aria-label="Slide Away — Oasis">
    <defs>
      <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#0d1117"/>
        <stop offset="100%" stop-color="#161b22"/>
      </linearGradient>
      <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#1DB954"/>
        <stop offset="100%" stop-color="#1ed760"/>
      </linearGradient>
      <linearGradient id="spotG" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#1DB954"/>
        <stop offset="100%" stop-color="#158a3e"/>
      </linearGradient>
      <clipPath id="cardClip">
        <rect width="450" height="88" rx="14"/>
      </clipPath>
    </defs>
    <!-- Card background -->
    <rect width="450" height="88" rx="14" fill="url(#cBg)" clip-path="url(#cardClip)"/>
    <rect width="450" height="88" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>
    <!-- Spotify circle icon -->
    <circle cx="44" cy="44" r="22" fill="url(#spotG)"/>
    <!-- Music note -->
    <text x="44" y="50" font-family="system-ui,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="white">♪</text>
    <!-- Animated equalizer bars (only when live) -->
    
    <!-- Status label -->
    <text x="78" y="22" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#3B82F6" font-weight="700" letter-spacing="0.5">♫ Featured Track</text>
    <!-- Song title -->
    <text x="78" y="44" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#f0f6fc" font-weight="700">Slide Away</text>
    <!-- Artist -->
    <text x="78" y="61" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#8b949e">Oasis</text>
    <!-- Album (small) -->
    <text x="78" y="76" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#484f58">Definitely Maybe</text>
    <!-- Progress bar bg -->
    <rect x="78" y="82" width="284" height="3" rx="1.5" fill="#21262d"/>
    <!-- Progress fill -->
    <rect x="78" y="82" width="156" height="3" rx="1.5" fill="url(#pGrad)"/>
    <!-- Progress dot -->
    <circle cx="234" cy="83.5" r="4" fill="#1DB954"/>
    <!-- Time stamps -->
    <text x="370" y="86" font-family="system-ui,sans-serif" font-size="9" fill="#484f58" text-anchor="middle">55%</text>
  </svg>