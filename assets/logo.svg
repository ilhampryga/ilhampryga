<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Ilham Prayoga Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="12" fill="url(#logoGrad)"/>
  <!-- I letter centered -->
  <text x="24" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">I</text>
  <!-- Accent dot -->
  <circle cx="36" cy="12" r="5" fill="white" opacity="0.25"/>
  <circle cx="36" cy="12" r="3" fill="white"/>
</svg>
