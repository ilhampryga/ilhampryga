<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="presentation">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="footerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wave background -->
  <rect width="900" height="120" fill="url(#footerGrad)"/>

  <!-- Animated wave top -->
  <path d="M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 L900,120 L0,120 Z" fill="#0d1220" opacity="0.5">
    <animate attributeName="d" values="M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 L900,120 L0,120 Z;M0,50 C150,20 300,60 450,50 C600,20 750,60 900,50 L900,120 L0,120 Z;M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 L900,120 L0,120 Z" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M0,60 C200,30 400,80 600,55 C750,35 850,65 900,55 L900,120 L0,120 Z" fill="#111827" opacity="0.6">
    <animate attributeName="d" values="M0,60 C200,30 400,80 600,55 C750,35 850,65 900,55 L900,120 L0,120 Z;M0,50 C200,40 400,70 600,45 C750,25 850,55 900,45 L900,120 L0,120 Z;M0,60 C200,30 400,80 600,55 C750,35 850,65 900,55 L900,120 L0,120 Z" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Top line accent -->
  <rect x="0" y="0" width="900" height="1" fill="url(#footerAccent)"/>

  <!-- Footer text -->
  <text x="450" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#475569" text-anchor="middle">
    Crafted with precision by Ilham Adi Prayoga
  </text>
  <text x="450" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155" text-anchor="middle" letter-spacing="1.5">
    INDONESIA · 2025
  </text>

  <!-- Blue dots decoration -->
  <circle cx="200" cy="68" r="2" fill="#2563EB" opacity="0.4"/>
  <circle cx="700" cy="68" r="2" fill="#2563EB" opacity="0.4"/>
</svg>
