<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Ilham Adi Prayoga – Hero Banner Light">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc">
        <animate attributeName="stop-color" values="#f8fafc;#f1f5f9;#f8fafc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <radialGradient id="glowBL" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glassBorderL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="nameGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <filter id="blur12L" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="dropShadowL" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#2563EB" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="900" height="280" fill="url(#bgGradL)" rx="16"/>
  <ellipse cx="270" cy="110" rx="220" ry="140" fill="url(#glowBL)" filter="url(#blur12L)"/>
  <ellipse cx="680" cy="180" rx="180" ry="120" fill="url(#glowBL2)" filter="url(#blur12L)"/>

  <!-- Subtle dot grid -->
  <pattern id="dotGridL" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.7" fill="#2563EB" opacity="0.06"/>
  </pattern>
  <rect width="900" height="280" fill="url(#dotGridL)" rx="16"/>

  <!-- Floating particles -->
  <circle cx="55" cy="42" r="1.5" fill="#2563EB" opacity="0.25">
    <animateTransform attributeName="transform" type="translate" values="0,0;4,-8;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="55" r="1" fill="#3B82F6" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,5;0,0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="220" r="1.2" fill="#2563EB" opacity="0.2">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,3;0,0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="240" r="1.8" fill="#3B82F6" opacity="0.2">
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,-6;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="18" r="1" fill="#60A5FA" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;3,4;0,0" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass card -->
  <rect x="32" y="24" width="836" height="232" rx="20" fill="url(#glassGradL)" filter="url(#dropShadowL)"/>
  <rect x="32" y="24" width="836" height="232" rx="20" fill="none" stroke="url(#glassBorderL)" stroke-width="1"/>

  <!-- Avatar -->
  <circle cx="108" cy="140" r="52" fill="none" stroke="url(#accentGradL)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="52;54;52" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="140" r="44" fill="#eff6ff"/>
  <circle cx="108" cy="140" r="44" fill="none" stroke="url(#accentGradL)" stroke-width="1" opacity="0.4"/>
  <text x="108" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="url(#nameGradL)" text-anchor="middle">I</text>

  <!-- Online dot -->
  <circle cx="142" cy="108" r="7" fill="#f8fafc"/>
  <circle cx="142" cy="108" r="6" fill="#2563EB">
    <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Name -->
  <text x="192" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="url(#nameGradL)" letter-spacing="-0.5">Ilham Adi Prayoga</text>

  <!-- Roles -->
  <text x="192" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#475569" letter-spacing="0.2">
    <tspan fill="#2563EB" font-weight="500">Software QA</tspan>
    <tspan fill="#94a3b8"> · </tspan>
    <tspan>Data Analyst</tspan>
    <tspan fill="#94a3b8"> · </tspan>
    <tspan>IoT Developer</tspan>
    <tspan fill="#94a3b8"> · </tspan>
    <tspan>Web Developer</tspan>
  </text>

  <line x1="192" y1="154" x2="580" y2="154" stroke="url(#accentGradL)" stroke-width="1" opacity="0.2"/>

  <!-- Location badge -->
  <rect x="192" y="166" width="106" height="26" rx="13" fill="#eff6ff" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="245" y="183" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="500">📍 Indonesia</text>

  <!-- Open to Work badge -->
  <rect x="308" y="166" width="120" height="26" rx="13" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="322" cy="179" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="358" y="183" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="500">Open To Work</text>

  <!-- Portfolio badge -->
  <rect x="440" y="166" width="148" height="26" rx="13" fill="#eff6ff" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="514" y="183" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="500">🌐 ilhampryga.pages.dev</text>

  <!-- Bottom text -->
  <text x="192" y="226" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.3">
    Indonesia · Informatics Engineering · Building scalable software &amp; IoT solutions
  </text>

  <!-- Right decorative hexagon -->
  <g transform="translate(700, 80)">
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="none" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.12"/>
    <polygon points="60,20 100,42 100,98 60,120 20,98 20,42" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.08"/>
    <circle cx="60" cy="70" r="22" fill="#eff6ff" stroke="url(#accentGradL)" stroke-width="1" stroke-opacity="0.4"/>
    <text x="60" y="77" font-family="system-ui" font-size="22" text-anchor="middle" fill="#2563EB" opacity="0.7">⚡</text>
  </g>

  <circle cx="850" cy="240" r="30" fill="none" stroke="#2563EB" stroke-width="0.5" stroke-opacity="0.1"/>
  <circle cx="850" cy="240" r="20" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-opacity="0.08"/>
</svg>
